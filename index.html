<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nordic Living – Furniture for a Kinder, Calmer Home</title>
    <meta
      name="description"
      content="Thoughtfully designed, sustainable Scandinavian furniture from Nordic Living. Free shipping over $499 and 30-day easy returns."
    />
    <meta name="theme-color" content="#F7F5F1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Persian typography. Font files are only fetched once an element uses
         the family, i.e. only in Persian mode. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply the stored language before first paint so RTL never flashes. -->
    <script>
      try {
        var stored = localStorage.getItem('nordic-living.lang.v1') === 'fa' ? 'fa' : 'en'
        document.documentElement.setAttribute('lang', stored)
        document.documentElement.setAttribute('dir', stored === 'fa' ? 'rtl' : 'ltr')
        document.documentElement.setAttribute('data-lang', stored)
      } catch (e) {}
    </script>
  </head>
  <body class="bg-cream text-ink font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
